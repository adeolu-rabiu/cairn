apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 61.1.0
    helm:
      valuesObject:
        grafana:
          enabled: true
          service:
            type: NodePort
            nodePort: 30300
          adminPassword: CairnGrafana2026
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi

        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          enabled: true
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by:
                - alertname
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: slack-notifications
              routes:
                - matchers:
                    - severity=critical
                  receiver: slack-notifications
                - matchers:
                    - severity=warning
                  receiver: slack-notifications
            receivers:
              - name: slack-notifications
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook-url
                    channel: '#researchops'
                    send_resolved: true
                    title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
                    text: |-
                      *Alert:* {{ .CommonLabels.alertname }}
                      *Status:* {{ .Status }}
                      *Severity:* {{ .CommonLabels.severity }}
                      *Namespace:* {{ .CommonLabels.namespace }}
                      *Instance:* {{ .CommonLabels.instance }}
                      *Summary:* {{ .CommonAnnotations.summary }}
                      *Description:* {{ .CommonAnnotations.description }}

          alertmanagerSpec:
            secrets:
              - slack-webhook
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
