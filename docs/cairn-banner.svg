  <text x="334" y="254" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">registered</text>
  <text x="334" y="267" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">UK care homes</text>

