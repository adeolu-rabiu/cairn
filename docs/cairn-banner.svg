  <text x="1030" y="244" font-family="Arial, sans-serif" font-size="9" fill="#3A6070" text-anchor="middle">Timescale · Qdrant</text>

  <rect x="1090" y="214" width="85" height="36" rx="5" fill="#0A2234" stroke="#1A3D50" stroke-width="1"/>
  <text x="1132" y="232" font-family="Arial, sans-serif" font-size="10" fill="#7AAAB8" text-anchor="middle" font-weight="bold">Identity</text>
  <text x="1132" y="244" font-family="Arial, sans-serif" font-size="9" fill="#3A6070" text-anchor="middle">Ory · GDPR</text>

