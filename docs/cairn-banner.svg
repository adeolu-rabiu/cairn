  <rect x="48" y="134" width="280" height="1" fill="#1E5060"/>

  <!-- Description -->
  <text x="48" y="160" font-family="Georgia, serif" font-size="14" fill="#94B8C4" font-style="italic">Reads tremor, stiffness &amp; fall signals from any</text>
  <text x="48" y="180" font-family="Georgia, serif" font-size="14" fill="#94B8C4" font-style="italic">smartwatch. Alerts the right person in under 5s.</text>

  <!-- 3 stat cards -->
  <!-- Stat 1 -->
  <rect x="48" y="210" width="105" height="66" rx="6" fill="#0A2D3F" stroke="#E8754A" stroke-width="1"/>
  <text x="100" y="237" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#E8754A" text-anchor="middle">153k</text>
  <text x="100" y="254" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">people with</text>
  <text x="100" y="267" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">Parkinson's in UK</text>

  <!-- Stat 2 -->
  <rect x="165" y="210" width="105" height="66" rx="6" fill="#0A2D3F" stroke="#00BFA5" stroke-width="1"/>
  <text x="217" y="237" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#00BFA5" text-anchor="middle">&lt; 5s</text>
  <text x="217" y="254" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">wrist to</text>
  <text x="217" y="267" font-family="Arial, sans-serif" font-size="10" fill="#5C8E9E" text-anchor="middle">triage alert</text>

