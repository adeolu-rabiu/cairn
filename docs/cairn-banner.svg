  <text x="920" y="244" font-family="Arial, sans-serif" font-size="9" fill="#3A6070" text-anchor="middle">Vault · Kyverno</text>

  <rect x="980" y="214" width="100" height="36" rx="5" fill="#0A2234" stroke="#1A3D50" stroke-width="1"/>
